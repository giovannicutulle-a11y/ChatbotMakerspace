<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Track your protein</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Protein">
<meta name="theme-color" content="#1F5FAE">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#152033; --muted:#5B6678; --line:#D7DDE7;
  --protein:#1F5FAE; --protein-soft:#DCE6F5; --carb:#E08A3C; --fat:#7B61B8; --kcal:#152033;
  --danger:#B23A3A; --overlay:rgba(15,22,35,.45);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F141C; --surface:#172030; --ink:#E6ECF5; --muted:#98A3B5; --line:#283347;
    --protein:#7AAAF0; --protein-soft:#1C2A42; --carb:#F2A65E; --fat:#A68BDB; --kcal:#E6ECF5;
    --danger:#E8837A; --overlay:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#172030; --ink:#E6ECF5; --muted:#98A3B5; --line:#283347;
  --protein:#7AAAF0; --protein-soft:#1C2A42; --carb:#F2A65E; --fat:#A68BDB; --kcal:#E6ECF5;
  --danger:#E8837A; --overlay:rgba(0,0,0,.6); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:84px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--protein);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
.num{font-variant-numeric:tabular-nums}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.who{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.who button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--muted);max-width:9.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.banner{margin:12px 0 0;padding:10px 12px;border-left:3px solid var(--carb);background:var(--surface);font-size:.9rem;color:var(--muted)}

/* Datum */
.datebar{display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px}
.datebar button{border:0;background:none;padding:8px 10px;font-size:1.3rem;line-height:1;color:var(--muted);border-radius:8px}
.datebar .datelabel{font-size:1rem;font-weight:600;color:var(--ink)}

/* Tagesbilanz */
.hero{padding:10px 0 22px;border-bottom:1px solid var(--line)}
.hero-p{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero-p .big{font-family:var(--display);font-weight:800;font-size:clamp(4.2rem,20vw,7.5rem);line-height:.9;letter-spacing:-.04em;color:var(--protein)}
.hero-p .unit{font-family:var(--display);font-weight:600;font-size:1.25rem}
.hero-p .of{color:var(--muted);font-size:1rem;width:100%}
.pbar{height:16px;background:var(--protein-soft);border-radius:4px;margin:14px 0 6px;overflow:hidden;position:relative}
.pbar i{display:block;height:100%;background:var(--protein);border-radius:4px;transition:width .35s ease}
.pnote{font-size:.9rem;color:var(--muted);margin:0 0 16px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.macro .lbl{font-size:.82rem;color:var(--muted)}
.macro .val{font-weight:600;font-size:1rem}
.macro .val small{font-weight:400;color:var(--muted);font-size:.82rem}
.thin{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.thin i{display:block;height:100%;border-radius:3px}
.over{color:var(--danger)}

/* Mahlzeiten */
.meal{padding:18px 0;border-bottom:1px solid var(--line)}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meal-h h3{margin:0;font-family:var(--display);font-weight:600;font-size:1.15rem}
.meal-sum{font-size:.85rem;color:var(--muted)}
.items{list-style:none;margin:10px 0 0;padding:0}
.items li button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;background:none;padding:9px 0;text-align:left;border-top:1px dashed var(--line)}
.items li:first-child button{border-top:0}
.items .n{font-weight:500}
.items .g{display:block;font-size:.82rem;color:var(--muted)}
.items .r{text-align:right;white-space:nowrap}
.items .r b{color:var(--protein);font-weight:600}
.items .r span{display:block;font-size:.82rem;color:var(--muted)}
.meal-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.92rem}
.btn.line{background:none;color:var(--ink);border-color:var(--line)}
.btn.danger{background:none;border-color:var(--danger);color:var(--danger)}
.btn.wide{width:100%;padding:13px 16px;font-size:1rem}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;padding:6px 0;color:var(--protein);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabs button{border:0;background:none;padding:14px 4px;font-weight:600;font-size:.92rem;color:var(--muted);border-top:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--protein)}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.open{display:block}
.sheet .bd{position:absolute;inset:0;background:var(--overlay)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet .panel{animation:none}.pbar i{transition:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sheet-h h2{margin:0;font-family:var(--display);font-weight:600;font-size:1.25rem}
.field{display:block;margin:0 0 12px}
.field span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
input[type=search],input[type=text],input[type=number],input[type=date],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.results{list-style:none;margin:8px 0;padding:0}
.results li button{width:100%;display:flex;justify-content:space-between;gap:12px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 2px;text-align:left}
.results .meta{font-size:.82rem;color:var(--muted)}
.results .pp{white-space:nowrap;color:var(--protein);font-weight:600;font-size:.9rem}
.tag{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
.hint{font-size:.88rem;color:var(--muted);margin:8px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.88rem}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 0;margin:4px 0 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.preview div{font-size:.8rem;color:var(--muted)}
.preview b{display:block;font-size:1.15rem;color:var(--ink);font-family:var(--display);font-weight:600}
.preview .pv b{color:var(--protein)}
.row-actions{display:flex;gap:10px}
.row-actions .btn{flex:1}

/* Verlauf */
h2.sec{font-family:var(--display);font-weight:600;font-size:1.35rem;margin:26px 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0 14px}
.stats div{font-size:.8rem;color:var(--muted)}
.stats b{display:block;font-family:var(--display);font-weight:600;font-size:1.4rem;color:var(--ink)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.week{list-style:none;margin:0;padding:0}
.week li{display:grid;grid-template-columns:4.2em 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.week .d{color:var(--muted)}
.week .bar{height:10px;background:var(--protein-soft);border-radius:3px;overflow:hidden}
.week .bar i{display:block;height:100%;background:var(--protein)}
.week .v{text-align:right;white-space:nowrap}
.week .v span{display:block;font-size:.8rem;color:var(--muted)}
.inline{display:flex;gap:10px;align-items:flex-end}
.inline .field{flex:1;margin:0}

/* Profil */
table.targets{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:.95rem}
table.targets th,table.targets td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left}
table.targets td:last-child,table.targets th:last-child{text-align:right}
table.targets th{font-size:.8rem;color:var(--muted);font-weight:500}
.small{font-size:.85rem;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:30;max-width:90%;display:none}
.toast.show{display:block}
/* Dashboard */
body.dash .wrap{max-width:1080px}
:root{--figure:#3F72B8;--figure-ghost:#C8D4E6;--figure-line:rgba(255,255,255,.6);--panel:#E1E8F3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--figure:#6E9BDB;--figure-ghost:#2B3852;--figure-line:rgba(8,12,20,.45);--panel:#1A2438}}
:root[data-theme="dark"]{--figure:#6E9BDB;--figure-ghost:#2B3852;--figure-line:rgba(8,12,20,.45);--panel:#1A2438}
.dgrid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px}
@media (min-width:860px){.dgrid.top{grid-template-columns:1.15fr 1fr}.dgrid.two{grid-template-columns:1fr 1fr}}
.pane{border-top:2px solid var(--ink);padding-top:12px}
.pane h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pane h2 small{font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted)}
.avp{background:var(--panel);border-radius:18px;padding:18px}
.avp h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0}
.avwrap{display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:18px;align-items:center;margin-top:8px}
@media (max-width:420px){.avwrap{grid-template-columns:1fr}.avwrap .fig{max-width:200px;margin:0 auto}}
.fig svg{display:block;width:100%;height:auto}
.bstats{margin:0;display:grid;gap:12px}
.bstats div{display:grid;gap:2px}
.bstats dt{font-size:.8rem;color:var(--muted)}
.bstats dd{margin:0;font-family:var(--display);font-weight:600;font-size:1.5rem;line-height:1.1}
.bstats dd small{font-family:var(--body);font-weight:500;font-size:.82rem;color:var(--muted);margin-left:4px}
.bstats dd .delta{font-size:.85rem;font-family:var(--body);font-weight:600;margin-left:6px}
.scale{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--line),var(--line));position:relative;margin-top:4px}
.scale i{position:absolute;top:-4px;width:3px;height:14px;background:var(--ink);border-radius:2px}
.proj{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.proj span{font-size:.82rem;color:var(--muted);width:100%}
.proj button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem;font-weight:600}
.proj button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.proj button:disabled{opacity:.45;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:18px}
@media (min-width:860px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{background:var(--surface);padding:12px 14px}
.kpi .l{font-size:.78rem;color:var(--muted);line-height:1.25}
.kpi .v{font-family:var(--display);font-weight:600;font-size:1.45rem;margin-top:4px}
.kpi .s{font-size:.8rem;color:var(--muted)}
.good{color:var(--protein)}
.warn{color:var(--carb)}
.split{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:4px 0 2px}
.split i{display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;color:#fff;font-style:normal;white-space:nowrap;overflow:hidden}
.split-l{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:8px}
.tops{list-style:none;margin:10px 0 0;padding:0;counter-reset:t}
.tops li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.tops b{color:var(--protein);font-weight:600}
.insights{list-style:none;margin:0;padding:0}
.insights li{padding:10px 0 10px 14px;border-left:3px solid var(--line);margin-bottom:8px;font-size:.94rem}
.insights li.pos{border-left-color:var(--protein)}
.insights li.att{border-left-color:var(--carb)}
.todaybox .big{font-family:var(--display);font-weight:800;font-size:clamp(3rem,11vw,4.6rem);line-height:.95;color:var(--protein);letter-spacing:-.03em}
.todaybox .row{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;padding:7px 0;border-bottom:1px solid var(--line)}
.todaybox .row span:first-child{color:var(--muted)}

.kpis{grid-template-columns:repeat(2,1fr)}
@media (min-width:860px){.kpis{grid-template-columns:repeat(4,1fr)}}
.tip{margin:12px 0 0;padding:10px 14px;border-left:3px solid var(--carb);background:var(--surface);font-size:.93rem}
.bigsub{font-size:1rem;font-weight:600;color:var(--ink);letter-spacing:0}
.recs{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.recs h3{margin:0 0 4px;font-family:var(--display);font-weight:600;font-size:1.05rem}
.rec-head{margin:0 0 8px;font-size:.93rem}
.reclist{list-style:none;margin:0;padding:0}
.reclist li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.reclist li div{display:grid;gap:1px;min-width:0}
.reclist b{font-weight:600}
.reclist span{font-size:.85rem;color:var(--protein);font-weight:600}
.reclist small{font-size:.8rem;color:var(--muted)}
.reclist .btn{padding:7px 12px;font-size:.84rem;white-space:nowrap;flex-shrink:0}
.wk-done{margin:0 0 6px}
.wk-due{margin:0 0 10px;padding:10px 12px;border-left:3px solid var(--protein);background:var(--protein-soft);font-size:.93rem}

.qrow{display:flex;gap:8px}
.qrow input{flex:1;min-width:0}
.scview{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden;margin:4px 0 8px}
.scview video{width:100%;height:100%;object-fit:cover;display:block}
.scview::after{content:"";position:absolute;left:12%;right:12%;top:35%;bottom:35%;border:2px solid rgba(255,255,255,.85);border-radius:8px;pointer-events:none}
.scview #qr-shaded-region{border-color:rgba(0,0,0,.45)!important}
.source{font-size:.78rem;color:var(--muted);margin-top:22px}
.mechip{font-weight:600;font-size:.9rem;padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auth{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:calc(28px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px))}
.auth .box{max-width:420px;margin:0 auto}
.auth h1{font-family:var(--display);font-weight:800;font-size:2.2rem;letter-spacing:-.03em;line-height:1;margin:18px 0 6px;color:var(--protein)}
.auth .lead{color:var(--muted);margin:0 0 22px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:18px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;color:var(--muted);margin:4px 0 16px}
.check input{margin-top:3px;width:18px;height:18px;flex-shrink:0}
.msg{padding:10px 12px;border-radius:10px;font-size:.9rem;margin:0 0 14px;background:var(--protein-soft)}
.msg.err{background:color-mix(in srgb, var(--danger) 14%, transparent);color:var(--danger)}
.tablewrap{overflow-x:auto;margin-top:10px}
table.users{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px}
table.users th,table.users td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.users th{font-size:.78rem;color:var(--muted);font-weight:500}
table.users td.r,table.users th.r{text-align:right}
[hidden]{display:none!important}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">Track your protein</div>
    <div class="who" role="tablist" aria-label="Mein Profil" id="who"></div>
  </div>
</header>

<main class="wrap">
  <div id="banner" class="banner" hidden></div>
  <div id="loading" class="loading">Daten werden geladen</div>

  <section id="v-dash" hidden></section>

  <section id="v-heute" hidden>
    <nav class="datebar" aria-label="Datum">
      <button id="prevDay" aria-label="Vorheriger Tag">&#8249;</button>
      <button id="dateLabel" class="datelabel" title="Zu heute springen"></button>
      <button id="nextDay" aria-label="Nächster Tag">&#8250;</button>
    </nav>
    <div id="hero" class="hero"></div>
    <div id="recsDay"></div>
    <div id="meals"></div>
  </section>

  <section id="v-verlauf" hidden>
    <h2 class="sec">Gewicht</h2>
    <p class="small" id="wWeekNote"></p>
    <div class="inline">
      <label class="field"><span>Gewicht dieser Woche in kg</span><input type="number" id="wKg" step="0.1" min="30" max="250" inputmode="decimal"></label>
      <button class="btn" id="wSave">Speichern</button>
    </div>
    <div id="wStats" class="stats"></div>
    <div id="wChart" class="chart"></div>
    <h2 class="sec">Letzte 7 Tage</h2>
    <p class="small" id="weekNote"></p>
    <ul class="week" id="week"></ul>
  </section>

  <section id="v-admin" hidden></section>

  <section id="v-profil" hidden>
    <h2 class="sec">Profil und Ziele</h2>
    <div id="profileForm"></div>
  </section>
</main>

<nav class="tabs" role="tablist" aria-label="Ansicht">
  <div class="wrap">
    <button data-tab="dash" aria-selected="true">Dashboard</button>
    <button data-tab="heute" aria-selected="false">Tag</button>
    <button data-tab="verlauf" aria-selected="false">Verlauf</button>
    <button data-tab="profil" aria-selected="false">Profil</button>
    <button data-tab="admin" aria-selected="false" id="adminTab" hidden>Admin</button>

      };
      chains[path] = (chains[path]||Promise.resolve()).catch(()=>{}).then(run);
      return chains[path].then(()=>true).catch(e=>{ toast(errText(e)); return false; });
    }
  };
})();

/* ---------- Zustand ---------- */
const S = {
  active: "p1",
  date: today(),
  tab: "heute",
  people: {p1:null, p2:null},
  weights: {p1:{}, p2:{}},
  custom: [],
  day: null, unsubDay: null
};
const dayPath = (pid=S.active, date=S.date) => "days/"+pid+"_"+date;
const person = (pid=S.active) => S.people[pid] || {};
const pname = pid => (S.people[pid] && S.people[pid].name) || DEFAULT_NAMES[pid];

function latestWeight(pid){
  const e = S.weights[pid]||{}; const ks = Object.keys(e).sort();
  return ks.length ? e[ks[ks.length-1]] : null;
}
function targets(pid=S.active){
  const p = person(pid);
  const w = latestWeight(pid) || p.weight;
  if(!w || !p.height || !p.age) return null;
  const bmr = 10*w + 6.25*p.height - 5*p.age + (p.sex==="w" ? -161 : 5);
  const act = Number(p.activity)||1.375;
  const goal = p.goal || "aufbau";
  const adj = goal==="aufbau" ? 0.10 : goal==="reduktion" ? -0.15 : 0;
  let kcal = Math.round(bmr*act*(1+adj)/10)*10;
  kcal = Math.max(kcal, Math.round(bmr/10)*10);           // nie unter den Grundumsatz
  if(p.kcalOverride) kcal = Number(p.kcalOverride);
  const ppk = Number(p.proteinPerKg) || (goal==="halten" ? 1.6 : 2.0);
  const protein = Math.round(w*ppk);
  const fat = Math.round(Math.max(0.8*w, kcal*0.25/9));
  const carbs = Math.max(0, Math.round((kcal - protein*4 - fat*9)/4));
  return {kcal, protein, fat, carbs, bmr:Math.round(bmr), tdee:Math.round(bmr*act), weight:w, ppk};
}
function sumItems(items){
  return (items||[]).reduce((a,i)=>({kcal:a.kcal+i.kcal,p:a.p+i.p,c:a.c+i.c,f:a.f+i.f}),{kcal:0,p:0,c:0,f:0});
}
function calcItem(food, grams){
  const k = grams/100;
  return {kcal:Math.round(food.kcal*k), p:r1(food.p*k), c:r1(food.c*k), f:r1(food.f*k)};
}

function searchFoods(q){
  const n = norm(q).trim(); if(!n) return [];
  const terms = n.split(/\s+/);
  const all = [...S.custom, ...BASE, ...BLV];
  const seen = new Set();
  return all.filter(f => terms.every(t => f._n.includes(t)))
    .filter(f => { const k=norm(f.name); if(seen.has(k)) return false; seen.add(k); return true; })
    .sort((a,b) => ((a.src==="blv") - (b.src==="blv")) || (norm(b.name).startsWith(terms[0]) - norm(a.name).startsWith(terms[0])) || a.name.length-b.name.length)
    .slice(0,40);
}
function foodRow(f, i){
  const tag = f.src==="claude" ? `<span class="tag">Claude</span>` : f.src==="custom" ? `<span class="tag">eigenes</span>` : f.src==="off" ? `<span class="tag">Marke</span>` : f.src==="blv" ? `<span class="tag">BLV</span>` : "";

function renderAiBox(q, count){

async function offSearch(q, count){
  const box = $("#aiBox"); if(!box) return;
  const fields = "code,product_name,product_name_de,brands,nutriments,serving_quantity,countries_tags";
  const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=20&fields=${fields}`;
  let data;
  try{
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 9000);
    const r = await fetch(url, {signal:ctrl.signal}); clearTimeout(to);
    if(!r.ok) throw new Error("http");
    data = await r.json();
  }catch(e){
    if(e && e.name==="TypeError") offDisabled = true;      // kein Netz oder blockiert
    if($("#aiBox")) $("#aiBox").innerHTML = count ? "" : manualHint;
    return;
  }
  const qNow = $("#q"); if(!qNow || qNow.value.trim()!==q || !$("#aiBox")) return;
  const num = v => typeof v==="number" ? v : (typeof v==="string" && v.trim()!=="" && !isNaN(+v) ? +v : null);
  const prods = (data.products||[]).map(p => {
    const n = p.nutriments||{};
    const kcal = num(n["energy-kcal_100g"]) ?? (num(n["energy_100g"])!=null ? num(n["energy_100g"])/4.184 : null);
    const pr = num(n.proteins_100g), c = num(n.carbohydrates_100g), f = num(n.fat_100g);
    const name = (p.product_name_de || p.product_name || "").trim();
    if(!name || kcal==null || pr==null || kcal>950) return null;
    const brand = (p.brands||"").split(",")[0].trim();
    const sq = num(p.serving_quantity);
    return {food: prepFood({id:"o"+(p.code||Math.random().toString(36).slice(2)), name:(brand && !name.toLowerCase().includes(brand.toLowerCase()) ? `${name} (${brand})` : name).slice(0,80),
      kcal:Math.round(kcal), p:r1(pr), c:r1(c||0), f:r1(f||0), portionLabel:"Portion", portionG: sq && sq>0 && sq<2000 ? Math.round(sq) : null, src:"off"}),
      ch:(p.countries_tags||[]).includes("en:switzerland")};
  }).filter(Boolean).sort((a,b)=>b.ch-a.ch).slice(0,10).map(x=>x.food);
  if(!prods.length){ $("#aiBox").innerHTML = count ? "" : manualHint; return; }
  addCtx.off = prods;
  $("#aiBox").innerHTML = `<p class="hint">Markenprodukte aus Open Food Facts (Schweizer Produkte zuerst)</p>
    <ul class="results">${prods.map((f,i)=>foodRow(f,"off"+i)).join("")}</ul>`;
  $("#aiBox").querySelectorAll("[data-pick]").forEach(b => b.onclick = () => openDetail(addCtx.off[+b.dataset.pick.slice(3)], true));
}

/* ---------- Strichcode-Scanner ---------- */
let scanStop = null;
function stopScan(){ const s = scanStop; scanStop = null; if(s){ try{ s(); }catch(e){} } }
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function openScanner(){
  openSheet(`<div class="sheet-h"><h2 id="sheetTitle">Strichcode scannen</h2><button class="btn line" id="scBack">Zurück</button></div>
    <div id="scView" class="scview"></div>
    <p class="hint" id="scHint">Kamera wird gestartet …</p>
    <div class="inline"><label class="field"><span>Oder Strichcode eintippen</span><input type="text" id="scCode" inputmode="numeric" autocomplete="off"></label><button class="btn" id="scGo">Suchen</button></div>`);
  $("#scBack").onclick = () => openAdd(addCtx.meal);
  $("#scGo").onclick = () => { const c = $("#scCode").value.replace(/\D/g,""); if(c.length>=8) lookupBarcode(c); else $("#scCode").focus(); };
  const hint = t => { const e=$("#scHint"); if(e) e.textContent = t; };
  let done = false;
  const found = code => { if(done) return; done = true; if(navigator.vibrate) navigator.vibrate(60); stopScan(); lookupBarcode(code); };
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ hint("Die Kamera ist hier nicht verfügbar. Tippe den Strichcode ein."); return; }
  try{
    let native = false;
    if("BarcodeDetector" in window){ try{ const f = await BarcodeDetector.getSupportedFormats(); native = f.includes("ean_13"); }catch(e){} }
    if(native){
      const det = new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}, audio:false});
      const view = $("#scView"); if(!view){ stream.getTracks().forEach(t=>t.stop()); return; }
      const v = document.createElement("video"); v.setAttribute("playsinline",""); v.muted = true; v.srcObject = stream; view.appendChild(v); await v.play();
      let alive = true, timer = null;
      scanStop = () => { alive = false; clearTimeout(timer); stream.getTracks().forEach(t=>t.stop()); };
      hint("Strichcode in den Rahmen halten.");
      const tick = async () => { if(!alive) return; try{ const r = await det.detect(v); if(r && r[0] && r[0].rawValue) return found(r[0].rawValue); }catch(e){} timer = setTimeout(tick, 200); };
      tick();
    } else {
      if(!window.__Html5QrcodeLibrary__) await loadScript("https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js");
      const L = window.__Html5QrcodeLibrary__; if(!$("#scView")) return;
      const F = L.Html5QrcodeSupportedFormats;
      const q = new L.Html5Qrcode("scView", {formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E], verbose:false});
      await q.start({facingMode:"environment"}, {fps:10, qrbox:(w,h)=>({width:Math.min(300,w*0.85), height:Math.min(140,h*0.5)})}, txt => found(txt), () => {});
      scanStop = () => { q.stop().then(()=>q.clear()).catch(()=>{}); };
      hint("Strichcode in den Rahmen halten.");
    }
  }catch(e){
    hint(e && e.name==="NotAllowedError" ? "Kein Kamerazugriff erlaubt. Erlaube die Kamera in den Browsereinstellungen oder tippe den Strichcode ein." : "Die Kamera konnte nicht gestartet werden. Tippe den Strichcode ein.");
  }
}
async function lookupBarcode(code){
  const local = S.custom.find(f => f.barcode===code);
  if(local){ openDetail(local); return; }
  openSheet(`<div class="sheet-h"><h2 id="sheetTitle">Produkt wird gesucht</h2><button class="btn line" data-close>Schliessen</button></div><p class="hint">Strichcode ${esc(code)} …</p>`);
  try{
    const ctrl = new AbortController(); const to = setTimeout(()=>ctrl.abort(), 9000);
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_de,brands,nutriments,serving_quantity`, {signal:ctrl.signal});
    clearTimeout(to);
    const j = r.ok ? await r.json() : null;
    const pr = j && j.status===1 ? j.product : null;
    const n = (pr && pr.nutriments) || {};
    const num = v => typeof v==="number" ? v : (typeof v==="string" && v.trim()!=="" && !isNaN(+v) ? +v : null);
    const kcal = num(n["energy-kcal_100g"]) ?? (num(n["energy_100g"])!=null ? num(n["energy_100g"])/4.184 : null);
    const name = pr ? (pr.product_name_de || pr.product_name || "").trim() : "";
    if(pr && name && kcal!=null && num(n.proteins_100g)!=null){
      const brand = (pr.brands||"").split(",")[0].trim(), sq = num(pr.serving_quantity);
      openDetail(prepFood({id:"o"+code, barcode:code, name:(brand && !name.toLowerCase().includes(brand.toLowerCase()) ? `${name} (${brand})` : name).slice(0,80),
        kcal:Math.round(kcal), p:r1(num(n.proteins_100g)), c:r1(num(n.carbohydrates_100g)||0), f:r1(num(n.fat_100g)||0),
        portionLabel:"Portion", portionG: sq && sq>0 && sq<2000 ? Math.round(sq) : null, src:"off"}), true);
      return;
    }
    openManual(name, code);
  }catch(e){
    toast("Keine Verbindung zur Produktdatenbank. Bitte Werte selbst erfassen.");
    openManual("", code);
  }
}

/* ---------- Körperzusammensetzung ---------- */
const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
function weightTrend(pid=S.active){
  const e = S.weights[pid]||{}; const keys = Object.keys(e).sort(); const t = today();
  if(!keys.length) return {cur:null, perWeek:null};
  const cur = e[keys[keys.length-1]];
  const recent = keys.filter(k => k > addDays(t,-43));
  let perWeek = null;
  if(recent.length >= 2){
    const xs = recent.map(k => (parseYmd(k)-parseYmd(recent[0]))/864e5), ys = recent.map(k=>e[k]);
    const span = xs[xs.length-1];
    if(span >= 5){
      const mx = xs.reduce((a,b)=>a+b,0)/xs.length, my = ys.reduce((a,b)=>a+b,0)/ys.length;
      const num = xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0), den = xs.reduce((a,x)=>a+(x-mx)**2,0);
      perWeek = den ? num/den*7 : null;
    }
  }
  return {cur, perWeek};
}
function bodyComp(pid=S.active){
  const p = person(pid);
  const w = weightTrend(pid).cur || p.weight;
  if(!w || !p.height || !p.age) return null;
  const h = p.height, male = p.sex !== "w";
  let bf, method;
  if(p.waist && p.neck && (male || p.hip)){
    const l = Math.log10;
    const bf0 = male ? 495/(1.0324-0.19077*l(p.waist-p.neck)+0.15456*l(h))-450
                     : 495/(1.29579-0.35004*l(p.waist+p.hip-p.neck)+0.22100*l(h))-450;
    const w0 = p.measureWeight || w;
    const fm = w0*bf0/100 + (w-w0)*0.75;            // Gewichtsänderung seit Messung: ca. 75 % Fett
    bf = fm/w*100; method = "Umfangmessung (US-Navy-Formel)";
  } else {
    const bmi = w/((h/100)**2);
    bf = 1.2*bmi + 0.23*p.age - 10.8*(male?1:0) - 5.4;
    method = "Schätzung aus BMI und Alter";
  }
  bf = clamp(bf, male?4:10, 55);
  return compose(w, bf, h, male, method);
}
function compose(w, bf, h, male, method){
  const fat = w*bf/100, lean = w-fat, hm = h/100;
  const ffmi = lean/(hm*hm) + 6.1*(1.8-hm);
  return {w, bf, fat, lean, ffmi, male, h, method};
}
function bfLabel(bf, male){
  const s = male ? [10,15,20,25] : [18,23,28,33];
  return bf<s[0] ? "Sehr definiert" : bf<s[1] ? "Athletisch" : bf<s[2] ? "Fit" : bf<s[3] ? "Durchschnittlich" : "Erhöht";
}
function ffmiLabel(x, male){
  const s = male ? [17,19,21,23] : [14.5,16,17.5,19];
  return x<s[0] ? "Unterdurchschnittlich" : x<s[1] ? "Durchschnittlich" : x<s[2] ? "Überdurchschnittlich" : x<s[3] ? "Sehr muskulös" : "Aussergewöhnlich";
}
/* Prognose: Energiebilanz und Proteinzufuhr der letzten 14 Tage fortgeschrieben */
function project(bc, st, weeks){
  const T = targets(); if(!bc || !T || !st || st.logged < 3 || !weeks) return null;
  const bal = st.avgKcal - T.tdee;
  const dW = bal*7*weeks/7700;
  const r = Math.min(1, st.avgP/T.protein);
  let dLean;
  if(dW >= 0){ const maxLean = (bc.male?0.2:0.1)*weeks*(0.3+0.7*r); dLean = Math.min(dW*(0.15+0.4*r), maxLean); }
  else { dLean = dW*Math.max(0.08, 0.35-0.27*r); }
  const w = Math.max(35, bc.w + dW);
  const fat = Math.max(bc.w*(bc.male?0.04:0.1)*0.9, bc.fat + (dW - dLean));
  const lean = w - fat;
  const res = compose(w, fat/w*100, bc.h, bc.male, bc.method);
  res.lean = lean; return res;
}

/* ---------- Avatar ---------- */
function smooth(pts){
  const n = pts.length; let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<n;i++){
    const p0=pts[(i-1+n)%n], p1=pts[i], p2=pts[(i+1)%n], p3=pts[(i+2)%n];
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d+"Z";
}
function figureShapes(bc){
  const male = bc.male;
  const f = clamp(male ? (bc.bf-8)/24 : (bc.bf-15)/27, 0, 1);
  const m = clamp(male ? (bc.ffmi-16)/8 : (bc.ffmi-13.5)/6.5, 0, 1);
  const c = 100, L = x => c-x, R = x => c+x;
  const nh=7+m*3.5+f*2.5, aw=7+m*5.5+f*5.5,
        sh=(male?38:31)+m*12+f*5,                 // Schulterbreite inkl. Deltamuskel
        sj=sh-aw,                                   // Schulterkante des Rumpfs
        ch=sj-2+f*9, wh=(male?22:18.5)+f*27+m*3, hh=(male?26:31)+f*18+m*2,
        tw=(male?14:15.5)+f*9+m*4, kw=8+f*3+m*1.5, cw=8.5+m*3+f*3.5;
  const side = s => [[s(nh),48],[s(nh+1),62],[s(sj-6),70],[s(sj),84],[s(ch),116],[s(Math.max(ch,wh)*0.96+f*4),148],[s(wh),176],[s(hh),212],[s(hh-4),236]];
  const lt = side(L), rt = side(R).reverse();
  const torso = smooth([...lt, ...rt]);
  const lc = hh*0.52;
  const leg = s => smooth([[s(hh-2),222],[s(lc+tw),262],[s(lc+kw),294],[s(lc+cw),314],[s(lc+5),346],[s(Math.max(1.5,lc-5)),346],[s(Math.max(1.5,lc-cw+2)),314],[s(Math.max(1.5,lc-kw)),294],[s(Math.max(1.5,lc-tw+3)),262],[s(1.5),242]]);
  const ex = Math.max(ch, wh*0.97) + aw*0.95 + 1.5, wx = Math.max(hh, wh) + aw*0.75 + 2;
  const arm = s => ({upper:`M${s(sj+aw*0.2)},${86}  Q${s(ex-1.5)},120 ${s(ex)},158`, fore:`M${s(ex)},158 Q${s((ex+wx)/2+1)},190 ${s(wx)},220`, hand:[s(wx),228]});
  const def = clamp(m*1.25 - f*1.15, 0, 0.85);
  return {torso, legs:[leg(L),leg(R)], arms:[arm(L),arm(R)], aw, def, ch, sh, c, L, R};
}
function figureSvg(F, fill, op=1){
  const a = F.arms.map(x=>`<path d="${x.upper}" stroke="${fill}" stroke-width="${(F.aw*2).toFixed(1)}" stroke-linecap="round" fill="none"/>
    <path d="${x.fore}" stroke="${fill}" stroke-width="${(F.aw*1.6).toFixed(1)}" stroke-linecap="round" fill="none"/>

async function loadHistory(force){
  const key = S.active+"|"+today();
  if(!force && S.hist && S.histKey===key) return S.hist;
  const t = today(); const days = Array.from({length:14},(_,i)=>addDays(t,i-13));
  const docs = await Store.getMany(days.map(d => dayPath(S.active,d)));
  S.hist = days.map((d,i)=>({date:d, items:(docs[i]&&docs[i].items)||[]})); S.histKey = key;
  return S.hist;
}
function stats(hist){
  const t = today();
  const days = hist.map(h => { const items = (h.date===t && S.date===t && S.day) ? (S.day.items||[]) : h.items; return {date:h.date, items, sum:sumItems(items)}; });
  const done = days.filter(d => d.date<t && d.sum.kcal>0);
  const d7 = done.filter(d => d.date>=addDays(t,-7));
  const avg = (a,k) => a.length ? a.reduce((s,d)=>s+d.sum[k],0)/a.length : null;
  let streak = 0; for(let i=days.length-1;i>=0;i--){ if(days[i].sum.kcal>0) streak++; else if(days[i].date===t) continue; else break; }
  return {days, logged:done.length, avgKcal:avg(done,"kcal"), avgP:avg(done,"p"),
    logged7:d7.length, avgKcal7:avg(d7,"kcal"), avgP7:avg(d7,"p"), avgC7:avg(d7,"c"), avgF7:avg(d7,"f"), streak, d7};
}

/* ---------- Diagramme ---------- */
function barChart(days, key, target, color, unit){
  const W=640,H=190,pl=40,pr=10,pt=14,pb=26,n=days.length,bw=(W-pl-pr)/n,t=today();
  const vals = days.map(d=>d.sum[key]); const max = Math.max(target||0, ...vals, 1)*1.12;
  const Y = v => pt + (1-v/max)*(H-pt-pb);
  const bars = days.map((d,i) => {
    const v = vals[i], x = pl+i*bw+bw*0.16, w = bw*0.68;
    if(!v) return `<rect x="${x}" y="${H-pb-2}" width="${w}" height="2" fill="var(--line)"/>`;
    const over = key==="kcal" && target && v>target*1.1;
    return `<rect x="${x}" y="${Y(v)}" width="${w}" height="${H-pb-Y(v)}" rx="2" fill="${over?"var(--danger)":color}" opacity="${d.date===t?0.5:1}"><title>${nf0.format(v)} ${unit}</title></rect>`;
  }).join("");
  const labels = days.map((d,i)=> i%2===(n-1)%2 ? `<text x="${pl+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.date===t?"heute":parseYmd(d.date).getDate()+"."}</text>` : "").join("");
  const tl = target ? `<line x1="${pl}" x2="${W-pr}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--ink)" stroke-dasharray="4 4" opacity=".7"/>
    <text x="${pl-6}" y="${Y(target)+4}" text-anchor="end" font-size="11" fill="var(--ink)">${nf0.format(target)}</text>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${unit} der letzten 14 Tage">
    <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/><text x="${pl-6}" y="${H-pb+4}" text-anchor="end" font-size="11" fill="var(--muted)">0</text>
    ${bars}${tl}${labels}</svg>`;
}

const slotsLeft = () => { const h=new Date().getHours(); return h<10?4:h<14?3:h<18?2:1; };

function recommend(sum, T, eatenItems=[]){
  const rem = {kcal:T.kcal-sum.kcal, p:T.protein-sum.p, c:T.carbs-sum.c, f:T.fat-sum.f};
  if(rem.p<=5 && rem.kcal<=150) return {state:"done", rem, list:[]};
  if(rem.kcal < -100 && rem.p <= 5) return {state:"over", rem, list:[]};
  const n = slotsLeft(), tp = Math.max(0,rem.p)/n, tk = Math.max(0,rem.kcal)/n;
  const leanOnly = rem.kcal < 200;
  let cands = IDEAS.map(([name,raw]) => ({name, items: raw.map(([fn,g]) => ({food:byName(fn), grams:g})).filter(x=>x.food)}));
  (lsGet("typ:recent:"+(S.uid||S.active))||[]).slice(0,8).forEach(f => { if(!cands.some(c=>c.name===f.name)) cands.push({name:f.name, items:[{food:f, grams:f.portionG||100}], recent:true}); });
  const eaten = new Set(eatenItems.map(i => norm(i.name)));
  const yItems = (S.hist && S.hist.length>1 ? S.hist[S.hist.length-2].items : []) || [];
  const eatenY = new Set(yItems.map(i => norm(i.name)));
  // Hauptzutaten: alles, was in der Idee mindestens 8 g Protein liefert (sonst die proteinreichste Zutat)
  const mains = c => { const withP = c.items.map(x => ({x, p:calcItem(x.food,x.grams).p})).sort((a,b)=>b.p-a.p);
    const big = withP.filter(y=>y.p>=8); return (big.length?big:withP.slice(0,1)).map(y=>norm(y.x.food.name)); };
  cands = cands.filter(c=>c.items.length)
    .filter(c => !eaten.has(norm(c.name)) && !mains(c).some(m => eaten.has(m)))
    .map(c => ({...c, n:nutOf(c.items), yesterday: mains(c).some(m => eatenY.has(m))}));
  cands.forEach(c => {
    const x = c.n, dens = x.p*4/Math.max(x.kcal,1);
    let s;
    if(rem.p > 5){
      s = Math.min(x.p, tp*1.15)/Math.max(tp,1)*100 - Math.max(0, x.kcal-Math.max(tk*1.2,150))/8 + dens*30;
      if(leanOnly && dens < 0.45) s -= 200;
    } else {
      s = 100 - Math.abs(tk-x.kcal)/8 - Math.max(0, x.f-Math.max(rem.f,0))*0.5;
    }
    if(c.recent) s += 6;
    if(c.yesterday) s -= 15;                      // Abwechslung zum Vortag
    c.score = s;
  });
  cands.sort((a,b)=>b.score-a.score);
  const list = [], used = new Set();
  for(const c of cands){ const m = mains(c)[0]; if(used.has(m)) continue; used.add(m); list.push(c); if(list.length===3) break; }
  return {state: rem.kcal<-100 ? "over" : "open", rem, per:{p:tp,k:tk}, list};
}

async function addToToday(items, meal){
  const t = today(); const stamp = Date.now().toString(36);
  const newItems = items.map((x,i) => { const v = x.food ? calcItem(x.food, x.grams) : x.v;
    return {id:"i"+stamp+i, name:x.food?x.food.name:x.name, grams:x.grams, ...v, meal,
      per100: x.food ? {kcal:x.food.kcal,p:x.food.p,c:x.food.c,f:x.food.f} : {kcal:v.kcal/x.grams*100,p:v.p/x.grams*100,c:v.c/x.grams*100,f:v.f/x.grams*100}}; });
  if(S.date===t){ await saveItems([...((S.day&&S.day.items)||[]), ...newItems]); }
  else { const cur = (await Store.get(dayPath(S.active,t))) || {items:[]}; await Store.set(dayPath(S.active,t), {person:S.active, date:t, items:[...(cur.items||[]), ...newItems]}); }

}

  const kpis = [
    k("Ø Protein, 7 Tage", st.avgP7!=null?nf0.format(st.avgP7)+" g":"–", T?`Ziel ${nf0.format(T.protein)} g`:"", T&&st.avgP7!=null?(st.avgP7>=T.protein*0.95?"good":"warn"):""),
    k("Proteinziel erreicht", T?`${hit7} / ${st.logged7||0}`:"–", "Tage diese Woche", T&&st.logged7&&hit7/st.logged7>=0.7?"good":""),
    k("Energiebilanz", bal!=null?(bal>0?"+":"−")+nf0.format(Math.abs(bal)):"–", "kcal pro Tag, Ø 14 Tage", balCls),
    k("Zielgewicht", goalW?nf1.format(goalW)+" kg":"–", goalW?`voraussichtlich ${eta}`:"im Profil festlegen")
  ].join("");

  /* ein Wochenfazit */
  let tip = "";
  if(st.logged < 3) tip = "Erfasse mindestens 3 vollständige Tage, damit Durchschnitte und Prognose aussagekräftig werden.";
  else if(p.goal==="aufbau" && bal<0) tip = `Im Schnitt ${nf0.format(-bal)} kcal unter deinem Bedarf. Für Muskelaufbau braucht es einen Überschuss von etwa 200 bis 400 kcal.`;
  else if(p.goal==="aufbau" && bal>500) tip = `Überschuss von ${nf0.format(bal)} kcal pro Tag baut mehr Fett als Muskeln auf; 200 bis 400 kcal reichen.`;
  else if(p.goal==="reduktion" && bal>-150) tip = "Kaum Kaloriendefizit. Für Fettabbau braucht es etwa 300 bis 600 kcal unter dem Bedarf.";
  else if(p.goal==="reduktion" && bal<-1000) tip = "Sehr grosses Defizit. Das erhöht das Risiko, Muskeln zu verlieren; moderater ist nachhaltiger.";
  else if(T && st.logged7 && hit7/st.logged7 < 0.7) tip = `Proteinziel nur an ${hit7} von ${st.logged7} Tagen erreicht. Im Schnitt fehlen ${nf0.format(Math.max(0,T.protein-st.avgP7))} g pro Tag.`;

  /* Wochengewicht */
  const we = thisWeekEntry(), nextMon = addDays(weekStart(today()),7);
  const sg = v => v==null ? "–" : Math.abs(v)<0.05 ? "±0 kg" : (v>0?"+":"−")+nf1.format(Math.abs(v))+" kg";
  const weightBox = we ? `
      <p class="wk-done num">Diese Woche gewogen: <b>${nf1.format(we.kg)} kg</b> am ${parseYmd(we.date).toLocaleDateString("de-CH",{weekday:"long"})}.</p>
      <table class="targets num"><tbody>
        <tr><td>Veränderung pro Woche</td><td>${sg(wt.perWeek)}</td></tr>
        <tr><td>Nächste Wiegung</td><td>ab ${parseYmd(nextMon).toLocaleDateString("de-CH",{weekday:"long",day:"numeric",month:"short"})}</td></tr>
      </tbody></table>
      <button class="link" id="wkEdit">Wert korrigieren</button>
      <div class="inline" id="wkForm" hidden><label class="field"><span>Gewicht in kg</span><input type="number" id="dKg" step="0.1" min="30" max="250" inputmode="decimal" value="${we.kg}"></label><button class="btn" id="dKgSave">Speichern</button></div>`
    : `<p class="wk-due">Wiegung für diese Woche fällig. Am besten morgens, nüchtern, gleiche Waage.</p>
      <div class="inline"><label class="field"><span>Gewicht in kg</span><input type="number" id="dKg" step="0.1" min="30" max="250" inputmode="decimal"></label><button class="btn" id="dKgSave">Speichern</button></div>
      ${wt.perWeek!=null?`<p class="small num">Bisheriger Trend: ${sg(wt.perWeek)} pro Woche</p>`:""}`;

  el.innerHTML = `
    <div class="dgrid top">
      <section class="avp" aria-labelledby="avh"><h2 id="avh">Dein Körper</h2>${av}</section>
      <section class="pane todaybox"><h2>Heute <small>${parseYmd(today()).toLocaleDateString("de-CH",{weekday:"long",day:"numeric",month:"long"})}</small></h2>${todayBox}</section>
    </div>
    <div class="kpis">${kpis}</div>
    ${tip?`<p class="tip">${tip}</p>`:""}
    <div class="dgrid two">
      <section class="pane"><h2>Protein <small>letzte 14 Tage, g</small></h2><div class="chart">${barChart(st.days,"p",T&&T.protein,"var(--protein)","g Protein")}</div></section>
      <section class="pane"><h2>Wochengewicht</h2>${weightBox}</section>
    </div>`;

  if(T) renderRecs($("#recsDash"), todayD.sum, T, todayD.items);
  el.querySelectorAll("[data-proj]").forEach(b => b.onclick = () => { S.proj = +b.dataset.proj; renderDashboard(); });
  const ed = $("#wkEdit"); if(ed) ed.onclick = () => { $("#wkForm").hidden = false; ed.hidden = true; $("#dKg").focus(); };
  const kgBtn = $("#dKgSave");
  if(kgBtn) kgBtn.onclick = async () => {
    const kg = Number($("#dKg").value);
    if(!(kg>=30 && kg<=250)){ $("#dKg").focus(); toast("Bitte ein Gewicht zwischen 30 und 250 kg eingeben."); return; }
    await saveWeeklyWeight(kg); renderDashboard();
  };
}

/* ---------- Sicherung ---------- */
function exportData(){
  const out = {app:"trackyourprotein", version:1, exported:new Date().toISOString(), data:{}};
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith("typ:") && k!=="typ:lastBackup") out.data[k]=localStorage.getItem(k); } }catch(e){}
  const blob = new Blob([JSON.stringify(out)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `trackyourprotein-sicherung-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  lsSet("typ:lastBackup", today()); toast("Sicherung erstellt");
}
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const j = JSON.parse(r.result);
      if(!j || j.app!=="trackyourprotein" || typeof j.data!=="object") throw new Error("format");
      if(!confirm("Die Sicherung ersetzt die Daten auf diesem Gerät. Fortfahren?")) return;
      Object.keys(localStorage).filter(k=>k.startsWith("typ:")).forEach(k=>localStorage.removeItem(k));
      Object.entries(j.data).forEach(([k,v]) => { if(k.startsWith("typ:")) localStorage.setItem(k, v); });
      location.reload();
    }catch(e){ toast("Diese Datei ist keine gültige Sicherung."); }
  };
  r.readAsText(file);
}

/* ---------- Konto ---------- */
async function exportCloud(){
  const {data, error} = await sb.from("docs").select("path,data,updated_at");
  if(error){ toast("Export fehlgeschlagen."); return; }
  const blob = new Blob([JSON.stringify({app:"trackyourprotein", exported:new Date().toISOString(), email:S.email, docs:data}, null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `trackyourprotein-export-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
async function deleteAccount(){
  if(!confirm("Konto und alle gespeicherten Daten endgültig löschen? Das kann nicht rückgängig gemacht werden.")) return;
  const {error} = await sb.rpc("delete_my_account");
  if(error){ toast("Löschen fehlgeschlagen. Bitte später erneut versuchen."); return; }
  try{ Object.keys(localStorage).filter(k=>k.startsWith("typ:")).forEach(k=>localStorage.removeItem(k)); }catch(e){}
  await sb.auth.signOut(); location.reload();
}

/* ---------- Anmeldung ---------- */
function authMsg(t, err){ const m = $("#authMsg"); if(m){ m.hidden = !t; m.textContent = t||""; m.className = "msg"+(err?" err":""); } }
function authError(e){
  const m = (e && e.message || "").toLowerCase();
  if(m.includes("invalid login")) return "E-Mail oder Passwort ist falsch.";
  if(m.includes("email not confirmed")) return "Bitte bestätige zuerst deine E-Mail-Adresse über den Link in deinem Postfach.";
  if(m.includes("already registered") || m.includes("already been registered")) return "Diese E-Mail-Adresse ist bereits registriert. Melde dich an.";
  if(m.includes("password")) return "Das Passwort muss mindestens 8 Zeichen lang sein.";
  if(m.includes("rate limit")) return "Zu viele Versuche. Bitte warte einige Minuten.";
  return "Das hat nicht geklappt. Bitte versuche es erneut.";
}
function showAuth(view="login"){
  const box = $("#authBox"); $("#auth").hidden = false;
  const reg = view==="register";
  box.innerHTML = `<h1>Track your protein</h1>
    <p class="lead">Kalorien und Protein tracken, Fortschritt sehen, Ziel erreichen.</p>
    <div class="seg" role="group"><button data-av="login" aria-pressed="${!reg}">Anmelden</button><button data-av="register" aria-pressed="${reg}">Profil erstellen</button></div>
    <p id="authMsg" class="msg" hidden></p>
    ${reg?`<label class="field"><span>Vorname</span><input type="text" id="auName" maxlength="30" autocomplete="given-name"></label>`:""}
    <label class="field"><span>E-Mail</span><input type="email" id="auMail" autocomplete="email" inputmode="email"></label>
    <label class="field"><span>Passwort${reg?" (mindestens 8 Zeichen)":""}</span><input type="password" id="auPw" autocomplete="${reg?"new-password":"current-password"}" minlength="8"></label>
    ${reg?`<label class="check"><input type="checkbox" id="auOk"><span>Ich bin einverstanden, dass meine Angaben, auch Gewicht und Körperwerte, gespeichert werden. Sie sind nur für mich sichtbar. Der Betreiber sieht Name, E-Mail und Aktivität. Ich kann mein Konto jederzeit löschen.</span></label>`:""}
    <button class="btn wide" id="auGo">${reg?"Profil erstellen":"Anmelden"}</button>
    ${reg?"":`<p><button class="link" id="auReset">Passwort vergessen?</button></p>`}`;
  box.querySelectorAll("[data-av]").forEach(b => b.onclick = () => showAuth(b.dataset.av));
  const go = async () => {
    const email = $("#auMail").value.trim(), pw = $("#auPw").value;
    if(!/^\S+@\S+\.\S+$/.test(email)){ authMsg("Bitte eine gültige E-Mail-Adresse eingeben.", true); return; }
    if(pw.length < 8){ authMsg("Das Passwort muss mindestens 8 Zeichen lang sein.", true); return; }
    const btn = $("#auGo"); btn.disabled = true;
    try{
      if(reg){
        const name = $("#auName").value.trim();
        if(!name){ authMsg("Bitte gib deinen Vornamen ein.", true); return; }
        if(!$("#auOk").checked){ authMsg("Bitte bestätige die Einwilligung.", true); return; }
        const {data, error} = await sb.auth.signUp({email, password:pw, options:{data:{display_name:name}, emailRedirectTo: location.origin+location.pathname}});
        if(error) throw error;
        if(data.session){ await enterApp(data.session); return; }
        authMsg("Fast geschafft: Wir haben dir eine E-Mail geschickt. Bestätige deine Adresse über den Link, danach kannst du dich anmelden.");
      } else {
        const {data, error} = await sb.auth.signInWithPassword({email, password:pw});
        if(error) throw error;
        await enterApp(data.session);
      }
    }catch(e){ authMsg(authError(e), true); }
    finally{ if($("#auGo")) $("#auGo").disabled = false; }
  };
  $("#auGo").onclick = go;
  box.querySelectorAll("input").forEach(i => i.addEventListener("keydown", e => { if(e.key==="Enter") go(); }));
  const rs = $("#auReset");
  if(rs) rs.onclick = async () => {
    const email = $("#auMail").value.trim();
    if(!/^\S+@\S+\.\S+$/.test(email)){ authMsg("Gib zuerst deine E-Mail-Adresse ein.", true); return; }
    const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin+location.pathname});
    authMsg(error ? authError(error) : "Falls ein Konto existiert, erhältst du eine E-Mail mit einem Link zum Zurücksetzen.", !!error);
  };
}
function showNewPassword(){
  $("#auth").hidden = false;
  $("#authBox").innerHTML = `<h1>Neues Passwort</h1><p class="lead">Lege ein neues Passwort fest.</p><p id="authMsg" class="msg" hidden></p>
    <label class="field"><span>Neues Passwort (mindestens 8 Zeichen)</span><input type="password" id="auPw" autocomplete="new-password"></label>
    <button class="btn wide" id="auGo">Speichern</button>`;
  $("#auGo").onclick = async () => {
    const pw = $("#auPw").value; if(pw.length<8){ authMsg("Das Passwort muss mindestens 8 Zeichen lang sein.", true); return; }
    const {error} = await sb.auth.updateUser({password:pw});
    if(error){ authMsg(authError(error), true); return; }
    location.replace(location.origin+location.pathname);
  };
}
let appStarted = false;
async function enterApp(session){
  S.uid = session.user.id; S.email = session.user.email; S.cloud = true; S.active = "p1";
  const {data:prof} = await sb.from("profiles").select("display_name,is_admin").eq("id", S.uid).maybeSingle();
  if(prof && prof.display_name) DEFAULT_NAMES.p1 = prof.display_name;
  S.isAdmin = !!(prof && prof.is_admin);
  $("#adminTab").hidden = !S.isAdmin;
  sb.from("profiles").update({last_seen:new Date().toISOString()}).eq("id", S.uid).then(()=>{});
  $("#auth").hidden = true;
  if(!appStarted){ appStarted = true; await startApp(); }
}

/* ---------- Admin ---------- */
async function renderAdmin(){
  const el = $("#v-admin");
  if(!S.isAdmin){ el.innerHTML = `<p class="small">Kein Zugriff.</p>`; return; }
  el.innerHTML = `<h2 class="sec">Profile</h2><p class="small">Wird geladen …</p>`;
  const {data, error} = await sb.rpc("admin_user_overview");
  if(S.tab!=="admin") return;
  if(error){ el.innerHTML = `<h2 class="sec">Profile</h2><p class="small">Übersicht konnte nicht geladen werden.</p>`; return; }
  const users = data||[], now = Date.now(), d = s => s ? new Date(s).toLocaleDateString("de-CH",{day:"numeric",month:"short",year:"numeric"}) : "–";
  const active7 = users.filter(u => u.last_seen && now-new Date(u.last_seen) < 7*864e5).length;
  const new30 = users.filter(u => now-new Date(u.created_at) < 30*864e5).length;
  el.innerHTML = `<h2 class="sec">Profile</h2>
    <div class="kpis" style="margin-top:6px">
      <div class="kpi"><div class="l">Profile total</div><div class="v num">${users.length}</div><div class="s">registriert</div></div>
      <div class="kpi"><div class="l">Aktiv</div><div class="v num">${active7}</div><div class="s">letzte 7 Tage</div></div>
      <div class="kpi"><div class="l">Neu</div><div class="v num">${new30}</div><div class="s">letzte 30 Tage</div></div>
      <div class="kpi"><div class="l">Erfasste Tage</div><div class="v num">${nf0.format(users.reduce((a,u)=>a+Number(u.days_logged||0),0))}</div><div class="s">alle Profile</div></div>
    </div>
    <div class="tablewrap"><table class="users"><thead><tr><th>Name</th><th>E-Mail</th><th>Registriert</th><th>Zuletzt aktiv</th><th class="r">Erfasste Tage</th></tr></thead>
    <tbody>${users.map(u=>`<tr><td>${esc(u.display_name||"–")}</td><td>${esc(u.email||"")}</td><td>${d(u.created_at)}</td><td>${d(u.last_seen)}</td><td class="r num">${nf0.format(Number(u.days_logged||0))}</td></tr>`).join("")}</tbody></table></div>
    <p class="small" style="margin-top:12px">Gewicht, Mahlzeiten und Körperwerte der Profile sind für den Administrator bewusst nicht sichtbar.</p>`;
}

/* ---------- Navigation ---------- */
function showTab(tab){
  S.tab = tab;
  document.querySelectorAll(".tabs [data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===tab));
  ["dash","heute","verlauf","profil","admin"].forEach(t => $("#v-"+t).hidden = t!==tab);
  if(tab==="admin") renderAdmin();
  document.body.classList.toggle("dash", tab==="dash");
  if(tab==="dash") renderDashboard(true);
  if(tab==="heute") renderToday();
  if(tab==="verlauf"){ renderWeights(); renderWeek(); }
  if(tab==="profil") renderProfile();
  window.scrollTo(0,0);
}
function subscribeDay(){
  if(S.unsubDay) S.unsubDay();
  const path = dayPath(); S.day = null;
  S.unsubDay = Store.sub(path, d => { if(path!==dayPath()) return; S.day = d || {items:[]}; if(S.tab==="heute") renderToday(); if(S.tab==="dash") renderDashboard(); });
}
function setPerson(pid){
  S.active = pid; lsSet("typ:active", pid); renderWho(); subscribeDay(); showTab(S.tab);
}
function setDate(d){ S.date = d; subscribeDay(); renderToday(); }

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.pid) setPerson(t.dataset.pid);
  else if(t.dataset.tab) showTab(t.dataset.tab);
  else if(t.dataset.goto) showTab(t.dataset.goto);
  else if(t.dataset.add) openAdd(t.dataset.add);
  else if(t.dataset.edit) openEdit(t.dataset.edit);
  else if(t.dataset.copy) copyFromYesterday(t.dataset.copy);
});
$("#prevDay").onclick = () => setDate(addDays(S.date,-1));
$("#nextDay").onclick = () => { if(S.date < today()) setDate(addDays(S.date,1)); };
$("#dateLabel").onclick = () => setDate(today());

/* ---------- Start ---------- */
async function startApp(){
  renderWho();
  const mode = await Store.init();
  ["p1"].forEach(pid => {
    Store.sub("people/"+pid, d => { S.people[pid]=d; renderWho(); if(S.tab==="heute") renderToday(); if(S.tab==="dash" && pid===S.active) renderDashboard(); });
    Store.sub("weights/"+pid, d => { S.weights[pid]=(d&&d.entries)||{}; if(pid===S.active){ if(S.tab==="heute") renderToday(); if(S.tab==="verlauf") renderWeights(); if(S.tab==="dash") renderDashboard(); } });
  });
  Store.sub("foods/custom", d => { S.custom = ((d&&d.items)||[]).map(prepFood); });
  subscribeDay();
  $("#loading").hidden = true;
  showTab("dash");
}
(async () => {
  if(cloudReady()){
    sb = supabase.createClient(CLOUD.url, CLOUD.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
    let recovering = false;
    sb.auth.onAuthStateChange(ev => { if(ev==="PASSWORD_RECOVERY"){ recovering = true; showNewPassword(); } });
    const {data:{session}} = await sb.auth.getSession();
    $("#loading").hidden = true;
    if(recovering || location.hash.includes("type=recovery")) return;
    if(!session){ showAuth(); return; }
    await enterApp(session);
  } else {
    appStarted = true; await startApp();
  }
})();
</script>
